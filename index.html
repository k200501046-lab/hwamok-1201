
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>화목선 가을 힐링 여행 안내</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f5f7f0;
      margin: 0;
      padding: 20px;
      color: #304536;
    }
    header {
      background: #315d48;
      color: white;
      padding: 35px 15px;
      text-align: center;
      border-radius: 18px;
    }
    main {
      background: white;
      padding: 20px;
      margin-top: 15px;
      border-radius: 14px;
    }
    button {
      background: #315d48;
      color: white;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <h1>화목선</h1>
    <p>2027 함께 걷는 날</p>
    <p>하나님의 사랑과 위로가 충만한 좋은날</p>
  </header>

  <main>
    <h2>행사 안내</h2>
    <p>날짜: 2026년 11월 30일-12월 1일 </p>
    <p>장소: 강원도 주문진 및 라카이 리조트</p>
    <p>출발: 오전 9시 (예시)</p>

    <h2>행사 일정</h2>
    <p>08:30 중리 IC 무료 공영 주차장 집결</p>
    <p>12:00 점심 식사 - 주문진시장 동성호 - </p>
    <p>14:00 주문진 해수욕장 족구장 및 풋살장 이동</p>

    <button onclick="alert('함께 걸어가요!')">
      환영합니다
    </button>
  </main>
</body>
</html>
